<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <title>{{TITLE}}</title>
    <script src="{{GSAP_SRC}}"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        font-style: normal;
        font-weight: 800;
        src: url("fonts/Montserrat-800.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      #cap-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
      .hl-group {
        position: absolute;
        bottom: 14%;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: center;
        gap: 8px;
        padding: 0 8%;
        opacity: 0;
        visibility: hidden;
      }
      .hl-word {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        color: #ffffff;
        display: inline-block;
        letter-spacing: 0.01em;
        line-height: 1;
        position: relative;
        isolation: isolate;
        padding: 4px 10px 6px;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
        transform-origin: 50% 58%;
        will-change: transform, filter;
      }
      .hl-word-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #ff1745 0%, #df1238 100%);
        border-radius: 8px;
        box-shadow: 0 10px 24px rgba(229, 20, 58, 0.32);
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
      }
      .hl-word-text { position: relative; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-duration="{{TOTAL_DURATION}}"
    >
{{MEDIA}}      <div id="cap-container">
{{CAPTION_DIVS}}      </div>
    </div>
    <script>
      var CANVAS_W = {{WIDTH}};
      var CAPTION_BASE_FONT = Math.round(CANVAS_W * 0.11);
      var CAPTION_MAX_WIDTH = Math.round(CANVAS_W * 0.84);

      var _fitCanvas = document.createElement("canvas");
      var _fitCtx = _fitCanvas.getContext("2d");
      function fitFontSize(text, baseFontSize, fontWeight, fontFamily, maxWidth) {
        var size = baseFontSize;
        var minSize = Math.floor(baseFontSize * 0.45);
        while (size > minSize) {
          _fitCtx.font = fontWeight + " " + size + "px " + fontFamily;
          if (_fitCtx.measureText(text).width <= maxWidth) return size;
          size -= 2;
        }
        return minSize;
      }

      const tl = gsap.timeline({ paused: true });
{{CAPTION_JS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
