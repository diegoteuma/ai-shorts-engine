server:
  port: ${API_PORT:8080}

spring:
  application:
    name: ai-shorts-engine
  # Spring AI (ChatClient): hoy solo lo usa el guionado (ClaudeScriptDraftingService).
  # Misma clave y modelo que claude.* de abajo; el generador de historias (drafts)
  # usa el SDK oficial anthropic-java (ClaudeStreamingClient), no Spring AI.
  ai:
    anthropic:
      api-key: ${CLAUDE_API_KEY}
      chat:
        options:
          model: ${CLAUDE_MODEL:claude-sonnet-5-5}
          # Los defaults de Spring AI 1.1.8 son max-tokens 500 (cortaría el JSON de 6
          # escenas) y temperature 0.8. Se fijan los del cliente anterior: 16000 (de
          # ClaudeConfig.of) y 1.0 (el default de la API, que es lo que aplicaba al no mandarla).
          max-tokens: 16000
          temperature: 1.0
    retry:
      # Sin reintentos, como el cliente anterior. El default de Spring AI es 10 intentos
      # con backoff exponencial (2 s x5, hasta minutos), y POST /stories espera en línea.
      max-attempts: 1

# Todo lo que EngineConfiguration lee con @Value, documentado en un solo
# lugar. Cada valor delega a una variable de entorno de nombre distinto
# (${CLAUDE_API_KEY}, etc.) -- OJO: nunca "clave: ${misma-clave}", porque
# Spring lo detecta como una referencia circular y el arranque falla (ya
# pasó una vez armando esto). Las credenciales quedan sin default a
# propósito: si falta alguna, el arranque falla con un mensaje claro en vez
# de arrancar con un valor vacío.
claude:
  api-key: ${CLAUDE_API_KEY}
  model: ${CLAUDE_MODEL:claude-sonnet-5-5}

higgsfield:
  base-url: ${HIGGSFIELD_BASE_URL}
  api-key-id: ${HIGGSFIELD_API_KEY_ID}
  api-key-secret: ${HIGGSFIELD_API_KEY_SECRET}
  model-standard: ${HIGGSFIELD_MODEL_STANDARD}
  model-premium: ${HIGGSFIELD_MODEL_PREMIUM}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY}
  voice-id: K3TeN3ZVK8WnOeJ0NYqZ

engine:
  data-dir: ${DATA_DIR:./data/stories}
  audio-dir: ${AUDIO_DIR:./data/audio}
  # Copia local de los clips de Higgsfield (se guardan cuando poll-generation deja
  # TODAS las escenas COMPLETED). El directorio se crea al descargar el primer clip.
  clips-dir: ${CLIPS_DIR:./data/clips}
  # Avisos de duración REAL (la del audio de TTS) en la respuesta de POST /stories/{id}/narration
  # y /cost-estimates (campo durationWarnings). Solo avisan, no bloquean nada. Defaults: los de
  # las reglas del generador (escena 3-8 s, total 35-40 s). Límites inclusivos, en segundos.
  duration-warnings:
    min-scene-seconds: ${DURATION_MIN_SCENE_SECONDS:3}
    max-scene-seconds: ${DURATION_MAX_SCENE_SECONDS:8}
    min-total-seconds: ${DURATION_MIN_TOTAL_SECONDS:35}
    max-total-seconds: ${DURATION_MAX_TOTAL_SECONDS:40}
  # Video final (POST /stories/{id}/final-video): lanza node video-renderer/src/make-video.mjs
  # (transcripción + composición + render con HyperFrames 0.8.143), un render a la vez.
  # DESHABILITADO por defecto: la API no tiene autenticación y esto lanza procesos
  # pesados; con false no existen ni el servicio ni las rutas. No exponer a internet.
  final-video:
    enabled: ${FINAL_VIDEO_ENABLED:false}
    # RENDERS_DIR/<idHistoria>/{job.json, final.mp4, job-<idTrabajo>/}
    renders-dir: ${RENDERS_DIR:./data/renders}
    renderer-dir: ${VIDEO_RENDERER_DIR:./video-renderer}
    node-command: ${NODE_COMMAND:node}
    # Disco libre mínimo para arrancar. SUPOSICIÓN sin medir: el render de tunguska
    # dejó un MP4 de 39 MB y la carpeta de trabajo copia los clips (~55 MiB) mientras corre.
    min-free-bytes: ${FINAL_VIDEO_MIN_FREE_BYTES:1073741824}
    # true: no borrar assets ni copias de la carpeta de trabajo (para depurar).
    keep-work-dir: ${FINAL_VIDEO_KEEP_WORK:false}
    # false (default): no se corre `hyperframes check` (make-video --skip-check). En la VM
    # tardó 1119.5 s de 2722.9 s (n = 1) y la composición sale siempre de la misma
    # plantilla; check se corre en desarrollo cuando cambian la plantilla o generate.mjs.
    # lint (6.6 s) y la validación del MP4 con ffprobe siguen corriendo siempre.
    check-enabled: ${FINAL_VIDEO_CHECK_ENABLED:false}
    # Segundos. Valores iniciales SIN MEDIR en la VM, salvo el render (1014 s medidos
    # para tunguska con --workers 1; 1800 deja margen). Transcripción: por escena.
    timeouts:
      transcribe-scene-seconds: ${FINAL_VIDEO_TRANSCRIBE_TIMEOUT_SECONDS:600}
      generate-seconds: ${FINAL_VIDEO_GENERATE_TIMEOUT_SECONDS:120}
      lint-seconds: ${FINAL_VIDEO_LINT_TIMEOUT_SECONDS:120}
      # check: 2400. Medido en la VM (e2-small, JVM encendida, explosion-halifax, 6 escenas,
      # video de 39.2 s): check tardó 1119.5 s, el 93 % del timeout anterior de 1200 s y
      # ~24 veces los 47 s de Windows (tunguska; dato del comentario anterior, no
      # re-verificado). 2400 es ~2.1 veces lo medido. Sale de UNA SOLA corrida: es una
      # hipótesis a revalidar con más corridas, no un valor garantizado.
      check-seconds: ${FINAL_VIDEO_CHECK_TIMEOUT_SECONDS:2400}
      # render: 1382.7 s en esa misma corrida (77 % de 1800). Si algún render supera
      # ~1500 s, reconsiderar este valor.
      render-seconds: ${FINAL_VIDEO_RENDER_TIMEOUT_SECONDS:1800}

# Límites de la descarga de clips. max-bytes es por clip (los 6 clips reales de
# tunguska pesan entre 3.0 y 16.2 MB); el timeout es el total por clip, no por
# lectura; min-free-bytes es el disco libre mínimo para empezar una descarga
# (la VM de producción tiene ~4 GB libres). Resolución esperada: la que se pide a
# Higgsfield (9:16, 720p); otro tamaño se rechaza y se avisa.
clip-download:
  max-bytes: ${CLIP_MAX_BYTES:67108864}
  timeout-seconds: ${CLIP_DOWNLOAD_TIMEOUT_SECONDS:120}
  connect-timeout-seconds: ${CLIP_CONNECT_TIMEOUT_SECONDS:10}
  min-free-bytes: ${CLIP_MIN_FREE_BYTES:536870912}
  expected-width: 720
  expected-height: 1280

# Generador de historias (paso previo al pipeline: propuestas, borrador con
# búsqueda web y PUERTA 0). Usa la misma API key y modelo de claude.* de
# arriba. Nada de esto llama a Higgsfield ni a ElevenLabs.
app:
  drafts:
    dir: ${DRAFTS_DIR:./data/drafts}
    # Si el archivo no está en el classpath, el arranque falla con un mensaje claro.
    rules-resource: prompts/story-generator-rules.md
    web-search:
      enabled: ${CLAUDE_WEB_SEARCH_ENABLED:true}
      # web_search_20260318 usa filtrado dinámico (code execution) por
      # defecto. Si el modelo la rechaza, se reintenta una vez con
      # fallback-tool-version y allowed_callers [direct].
      tool-version: ${CLAUDE_WEB_SEARCH_TOOL_VERSION:web_search_20260318}
      allowed-callers: []
      fallback-tool-version: ${CLAUDE_WEB_SEARCH_FALLBACK_TOOL_VERSION:web_search_20250305}
      max-uses-draft: ${CLAUDE_WEB_SEARCH_MAX_USES:10}
      max-uses-proposals: ${CLAUDE_WEB_SEARCH_MAX_USES_PROPOSALS:3}
    # Las llamadas van con streaming: este es el tiempo máximo SIN recibir
    # ningún evento (ni ping) y el de espera de los headers. No limita la
    # duración total mientras Claude siga mandando eventos. Es el readTimeout
    # de OkHttp en Http11OkHttpClient (callTimeout en 0).
    read-timeout-seconds: ${CLAUDE_READ_TIMEOUT_SECONDS:180}
    max-pause-continuations: 5
    # Tope de salida POR LLAMADA del generador de historias. En claude-sonnet-5-5 el thinking
    # adaptativo está activo por defecto y max_tokens limita thinking + texto juntos: con
    # 16000 una respuesta puede quedar entera en thinking y llegar sin texto (stop_reason
    # max_tokens; así lo advierte la guía de migración de la API). 64000 es lo recomendado con streaming; el máximo del modelo es 128000.
    max-tokens: ${CLAUDE_DRAFT_MAX_TOKENS:64000}
    words-per-second: 2.65
    min-total-words: 92
    max-total-words: 104
    min-scene-seconds: 3
    max-scene-seconds: 8
    # Rangos sugeridos por escena (tabla de la sección 4 de las reglas): solo advertencia.
    scene-word-ranges:
      GANCHO: { min: 10, max: 14 }
      EXPLICACION: { min: 17, max: 21 }
      CONTEXTO: { min: 16, max: 20 }
      GIRO: { min: 13, max: 17 }
      CONSECUENCIA: { min: 16, max: 20 }
      CIERRE: { min: 8, max: 12 }
    style-anchor: "Hyperrealistic cinematic documentary footage, vertical 9:16 composition"
    # Palabras completas, sin distinguir mayúsculas. Cualquiera de estas en un visualPrompt es violación dura.
    forbidden-visual-terms: [animated, animation, diagram, illustration, vector, cartoon, infographic,
                             "mushroom cloud", crater, impact, crash, "ground blast"]
    # Heurística de "bloque de negativos" (el modelo de video no tiene prompt negativo).
    negative-prompt-terms: [avoid, "do not", "does not", "don't", "must not", never, "negative prompt", without]
    # Solo advertencia (SOFT), en el visualPrompt del GANCHO: abre con un plano tranquilo y
    # llega al elemento clave por panorámica/inclinación. Lista cerrada, misma búsqueda por palabra completa.
    slow-reveal-terms: ["slowly tilting", "tilting upward", "tilt up", "pans to reveal", "pan to reveal", "to reveal",
                        "slowly reveals", "starting on a calm"]
    # Solo advertencia (SOFT), en el title y en la narración de las escenas 1-3: absolutos que
    # necesitan una fuente que lo diga literalmente (sección 6 de las reglas).
    absolute-terms: [jamás, nunca]
    # Una entrada cubre sus subdominios; si empieza con "." es un sufijo (.edu, .gov).
    tier-a-domains: [nasa.gov, usgs.gov, esa.int, noaa.gov, doi.org, nature.com, science.org, pnas.org,
                     agupubs.onlinelibrary.wiley.com, iopscience.iop.org, aanda.org, sciencedirect.com,
                     link.springer.com, royalsocietypublishing.org, nhm.ac.uk, amnh.org, unesco.org, who.int,
                     .edu, .gov, .ac.uk, .edu.mx, .gob.mx]
    tier-b-domains: [britannica.com, smithsonianmag.com, nationalgeographic.com, scientificamerican.com,
                     newscientist.com, sciencenews.org, bbc.com, bbc.co.uk, history.com, livescience.com, space.com]
    # Sirven para orientarse pero no cuentan como fuente (ni tier A ni B).
    orientation-only-domains: [wikipedia.org]
